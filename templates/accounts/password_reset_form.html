{% extends "base_dtf.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block page_title %}Recuperar contraseña{% endblock %}
{% block content %}
<div class="card" style="max-width:520px; margin:auto;">
  <p>Introduce tu email para recibir el enlace de restablecimiento.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="cta" type="submit">Enviar</button>
  </form>
</div>
{% endblock %}
