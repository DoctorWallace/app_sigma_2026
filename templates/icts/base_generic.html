{% extends 'base_icts.html' %}
{% load form_extras %}

{% block extra_css %}
<style>
/* Base Generic Styles for ICTS Forms */
:root {
  --primary: #1a365d;
  --primary-dark: #0f2a4a;
  --primary-light: #2d5a8b;
  --accent: #17a2b8;
  --accent-light: #20c997;
  --success: #198754;
  --warning: #ffc107;
  --danger: #dc3545;
  --info: #0dcaf0;
  --secondary: #6c757d;
  --bg-main: #f7fafc;
  --bg-card: #ffffff;
  --bg-sidebar: #2d3748;
  --text-primary: #2d3748;
  --text-secondary: #4a5568;
  --text-light: #718096;
  --text-white: #ffffff;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);
  --shadow-hover: 0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
  --gradient-primary: linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  --gradient-accent: linear-gradient(135deg,var(--accent) 0%,var(--accent-light) 100%);
}

/* Card Styles */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 1rem;
  padding: 1.5rem;
  box-shadow: var(--shadow);
  margin-bottom: 1.5rem;
  transition: all 0.3s ease;
}

.card:hover {
  box-shadow: var(--shadow-hover);
}

.card-header {
  border-bottom: 2px solid var(--border);
  padding-bottom: 1rem;
  margin-bottom: 1.5rem;
}

.card-title {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0;
}

/* Form Styles */
.form-group {
  margin-bottom: 1.5rem;
}

.form-label {
  display: block;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 0.5rem;
  font-size: 1rem;
}

.form-input, input[type="text"], input[type="email"], input[type="number"], 
textarea, select {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 2px solid var(--border);
  border-radius: 0.5rem;
  font-size: 1rem;
  transition: all 0.2s ease;
  background: var(--bg-card);
  color: var(--text-primary);
}

.form-input:focus, input[type="text"]:focus, input[type="email"]:focus, 
input[type="number"]:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
}

textarea.form-input {
  resize: vertical;
  min-height: 100px;
  font-family: inherit;
}

/* Button Styles */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem 1.5rem;
  border: 2px solid transparent;
  border-radius: 0.5rem;
  font-size: 1rem;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
  background: var(--primary);
  color: white;
}

.btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-secondary {
  background: var(--secondary);
  color: white;
}

.btn-success {
  background: var(--success);
  color: white;
}

.btn-warning {
  background: var(--warning);
  color: var(--text-primary);
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-info {
  background: var(--info);
  color: white;
}

/* Alert Styles */
.alert {
  padding: 1rem 1.5rem;
  border-radius: 0.5rem;
  margin-bottom: 1rem;
  border-left: 4px solid;
}

.alert.error {
  background: #fef2f2;
  border-left-color: var(--danger);
  color: #991b1b;
}

.alert.success {
  background: #f0fdf4;
  border-left-color: var(--success);
  color: #166534;
}

.alert.warning {
  background: #fffbeb;
  border-left-color: var(--warning);
  color: #92400e;
}

.alert.info {
  background: #eff6ff;
  border-left-color: var(--info);
  color: #1e40af;
}

/* Table Styles */
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-card);
  border-radius: 0.5rem;
  overflow: hidden;
  box-shadow: var(--shadow);
}

th, td {
  padding: 1rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

th {
  background: var(--bg-main);
  font-weight: 600;
  color: var(--text-primary);
}

tr:hover {
  background: var(--bg-main);
}

/* Badge Styles */
.badge {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  border-radius: 9999px;
  font-size: 0.875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.badge.red {
  background: #fee2e2;
  color: #991b1b;
}

.badge.yellow {
  background: #fef9c3;
  color: #854d0e;
}

.badge.green {
  background: #dcfce7;
  color: #166534;
}

.badge.blue {
  background: #dbeafe;
  color: #1e40af;
}

/* Utility Classes */
.muted {
  color: var(--text-light);
  font-size: 0.875rem;
}

.mb-4 {
  margin-bottom: 1rem;
}

.mt-4 {
  margin-top: 1rem;
}

.text-center {
  text-align: center;
}

.d-flex {
  display: flex;
}

.gap-2 {
  gap: 0.5rem;
}

.gap-4 {
  gap: 1rem;
}

/* Actions */
.actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 2rem;
}

/* Page Title */
.page-title {
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 2rem;
  text-align: center;
}

/* Responsive */
@media (max-width: 768px) {
  .card {
    padding: 1rem;
  }
  
  .actions {
    flex-direction: column;
    align-items: center;
  }
  
  .btn {
    width: 100%;
    max-width: 300px;
  }
  
  table {
    font-size: 0.875rem;
  }
  
  th, td {
    padding: 0.75rem 0.5rem;
  }
}
</style>
{% endblock %}

{% block content %}
<div class="container">
  {% if messages %}
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
  
  {% block page_content %}{% endblock %}
</div>
{% endblock %}
