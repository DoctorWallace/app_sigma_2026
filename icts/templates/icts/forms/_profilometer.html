<div class="tech-card">
  <h4 class="tech-title"><i class="bi bi-rulers"></i> Perfilómetro - Datos de muestras</h4>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Número de muestras</label>
      <input type="number" name="profilometer_num_samples" min="0" class="form-input" placeholder="0">
    </div>
    <div class="form-group">
      <label class="form-label">Rango (µm)</label>
      <input type="number" step="any" name="profilometer_range_um" class="form-input" placeholder="10">
    </div>
    <div class="form-group">
      <label class="form-label">Resolución (nm)</label>
      <input type="number" step="any" name="profilometer_resolution_nm" class="form-input" placeholder="1">
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">Descripción / regiones a medir</label>
    <textarea name="profilometer_notes" rows="4" class="form-input" placeholder="Describe geometría, tolerancias y puntos de medida"></textarea>
  </div>
</div>
