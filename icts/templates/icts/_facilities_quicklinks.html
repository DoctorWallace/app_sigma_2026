<style>
/* Base */
.quicklinks{
  list-style:none;
  margin:0;
  padding:0;
}

/* Opción A: QUICK GRID (CSS Grid auto-fit) */
.quick-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap:.75rem;
}

/* Opción B: QUICK WRAP (Flexbox con wrap) */
.quick-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:.75rem;
}

/* Tarjetas-enlace */
.quicklink{
  display:block;
  padding:.85rem 1rem;
  border:1px solid var(--border, #e5e7eb);
  border-radius:.6rem;
  background:var(--bg-card, #fff);
  color:var(--text, #111827);
  font-weight:600;
  text-decoration:none;
  transition: box-shadow .15s ease, transform .05s ease;
  white-space:normal; overflow-wrap:anywhere;
}
.quicklink:hover,
.quicklink:focus{
  box-shadow:0 4px 16px rgba(0,0,0,.06);
  transform:translateY(-1px);
  outline: none;
}

.quicklink{
  display:flex;
  flex-direction: column-reverse;  /* ← invierte el orden: primero el texto (span), luego el icono (img) */
  align-items:center;
  text-align:center;
  gap:.35rem;
  padding:.9rem 1rem;
}
.facility-logo{
  width:150px;   /* ajusta tamaño si quieres */
  height:150px;
  object-fit:contain;
  flex:0 0 auto;
}
.quicklink span{
  line-height:1.2;
}

</style>
