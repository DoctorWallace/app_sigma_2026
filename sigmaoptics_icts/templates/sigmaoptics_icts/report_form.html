{% extends "sigmaoptics_icts/base_sigmaoptics_icts.html" %}

{% block optics_content %}
<div class="optics-card">
  <h2 style="margin-top:0;">Informe Optics</h2>
  <p class="text-muted mb-3">
    Solicitud: {{ session.request_code|default:"-" }} · Informe: {{ session.report_code|default:"-" }}
  </p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex flex-wrap gap-2">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-outline-secondary" href="{% url 'sigmaoptics_icts:session_detail' session.pk %}">
        Volver
      </a>
    </div>
  </form>
</div>
{% endblock %}
