{% extends "base_dtf.html" %}
{% block title %}Nuevo avance{% endblock %}
{% block page_title %}Nuevo avance{% endblock %}
{% block content %}
<div class="card" style="max-width:900px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="margin-top:1rem;">
      <button class="cta" type="submit">Guardar avance</button>
      <a class="cta" style="background:var(--accent)" href="{% url 'sigmalab:detalle-solicitud' solicitud.pk %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
